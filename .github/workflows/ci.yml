name: CI

# Build, lint, testes e bundle a cada push no master e em pull requests.
on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Instalar dependências
        run: npm ci

      - name: Lint (oxlint)
        run: npm run lint

      - name: Testes (Vitest)
        run: npm run test

      - name: Build (tsc + vite)
        run: npm run build

  # Deploy: pendente da decisão de hospedagem do front (Cloudflare Pages /
  # Netlify — estático). Quando definido, adicionar um job "deploy" que roda
  # após build-test no push do master.
